<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge From Zero - Animasi Visual Pembagian Kartu Real-Time Engine ➔ UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    
    .hand-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      padding-top: 16px;
      padding-bottom: 8px;
    }
    
    .card-hand-item {
      margin-left: -44px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.8);
    }
    @media (min-width: 640px) {
      .card-hand-item {
        margin-left: -64px;
      }
    }
    .card-hand-item.dealt {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .card-hand-item:first-child {
      margin-left: 0;
    }
    
    .card-hand-item:hover {
      transform: translateY(-20px) scale(1.05) !important;
      z-index: 999 !important;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F1F5F9] text-slate-800 min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Header Control Demo -->
  <header class="w-full max-w-4xl mx-auto flex flex-col space-y-3 py-2 px-1">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="font-extrabold text-base sm:text-xl tracking-tight text-slate-900 flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
          VISUALISASI ANIMASI DEALER ENGINE ➔ UI REAL-TIME
        </span>
      </div>
      <button id="deal-btn" onclick="animateDeal()" class="bg-[#059669] hover:bg-[#047857] text-white text-xs font-extrabold px-5 py-2.5 rounded-xl shadow-lg transition border border-emerald-600 flex items-center gap-2">
        <span>✨</span>
        <span>MAINAN ANIMASI BAGI KARTU ENGINE</span>
      </button>
    </div>
  </header>

  <!-- KONTEN UTAMA: VISUALISASI MEJA PERMAINAN DENGAN ANIMASI PEMBAGIAN -->
  <main class="flex-1 max-w-4xl mx-auto w-full flex flex-col items-center justify-between my-2 sm:my-4">
    
    <!-- ARENA MEJA GAME KASINO HIJAU EMERALD -->
    <div class="w-full bg-[#0B231B] border border-emerald-900 rounded-3xl p-3 sm:p-5 shadow-2xl flex flex-col justify-between space-y-4">
      
      <!-- 1. KARTU NORTH (PARTNER) -->
      <div class="w-full flex flex-col items-center space-y-1">
        <div class="flex items-center space-x-3 bg-[#061812] px-3.5 py-1 rounded-full border border-emerald-900">
          <span class="text-xs font-bold text-amber-400">👤 KARTU PARTNER (NORTH)</span>
          <span id="hcp-north" class="text-xs font-extrabold text-emerald-300">-- HCP</span>
          <span id="dist-north" class="text-[10px] font-bold text-slate-300 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">--</span>
        </div>

        <div class="w-full flex justify-center items-center overflow-x-auto min-h-[110px] sm:min-h-[180px]">
          <div id="hand-north" class="hand-container"></div>
        </div>
      </div>

      <!-- BOARD INFORMASI STEP BY STEP ENGINE ENGINE WORKFLOW -->
      <div id="status-board" class="w-full max-w-md mx-auto bg-[#071E17] border border-emerald-800 rounded-2xl p-3 text-center text-xs font-bold text-emerald-200 shadow-lg space-y-1">
        <div class="text-amber-400 font-extrabold text-sm">💡 KANAN: ENGINE MENGOCOK 52 KARTU ACAL (FISHER-YATES)</div>
        <div id="status-desc" class="text-slate-300 text-[11px]">Klik tombol "MAINAN ANIMASI BAGI KARTU ENGINE" di atas untuk memulai simulasi data stream!</div>
      </div>

      <!-- 2. KARTU SOUTH (ANDA) -->
      <div class="w-full flex flex-col items-center space-y-1">
        <div class="w-full flex justify-center items-center overflow-x-auto min-h-[110px] sm:min-h-[180px]">
          <div id="hand-south" class="hand-container"></div>
        </div>

        <div class="flex items-center space-x-3 bg-[#061812] px-3.5 py-1 rounded-full border border-emerald-900">
          <span class="text-xs font-bold text-emerald-300">👤 KARTU ANDA (SOUTH)</span>
          <span id="hcp-south" class="text-xs font-extrabold text-amber-400">-- HCP</span>
          <span id="dist-south" class="text-[10px] font-bold text-slate-300 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">--</span>
        </div>
      </div>

    </div>

  </main>

  <script>
    const suits = ['spades', 'hearts', 'diamonds', 'clubs'];
    const ranks = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
    const hcpMap = { 'A': 4, 'K': 3, 'Q': 2, 'J': 1 };
    const suitColors = { 'spades': '#1E293B', 'hearts': '#E11D48', 'diamonds': '#D97706', 'clubs': '#059669' };
    const suitSymbols = { 'spades': '♠', 'hearts': '♥', 'diamonds': '♦', 'clubs': '♣' };

    function createDeck() {
      const deck = [];
      suits.forEach(s => { ranks.forEach(r => { deck.push({ suit: s, rank: r, hcp: hcpMap[r] || 0 }); }); });
      return deck;
    }

    function shuffle(deck) {
      const shuffled = [...deck];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function sortHand(hand) {
      return hand.sort((a, b) => {
        if (a.suit !== b.suit) return suits.indexOf(a.suit) - suits.indexOf(b.suit);
        return ranks.indexOf(a.rank) - ranks.indexOf(b.rank);
      });
    }

    function evalHand(hand) {
      let hcp = 0;
      let count = { spades: 0, hearts: 0, diamonds: 0, clubs: 0 };
      hand.forEach(c => { hcp += c.hcp; count[c.suit]++; });
      return { hcp, dist: Object.values(count).sort((a, b) => b - a).join('-') };
    }

    async function animateDeal() {
      const dealBtn = document.getElementById('deal-btn');
      const statusDesc = document.getElementById('status-desc');
      dealBtn.disabled = true;

      // Reset UI
      document.getElementById('hand-north').innerHTML = '';
      document.getElementById('hand-south').innerHTML = '';
      statusDesc.innerText = '⚙️ [Step 1] Dealer Engine sedang mengocok 52 kartu acak secara adil...';

      await new Promise(r => setTimeout(r, 600));

      const deck = shuffle(createDeck());
      const northHand = sortHand(deck.slice(0, 13));
      const southHand = sortHand(deck.slice(13, 26));

      const evalNorth = evalHand(northHand);
      const evalSouth = evalHand(southHand);

      statusDesc.innerText = '📊 [Step 2] Engine mengurutkan suit ♠-♥-♦-♣ & menghitung HCP + Distribusi...';
      document.getElementById('hcp-north').innerText = `${evalNorth.hcp} HCP`;
      document.getElementById('dist-north').innerText = evalNorth.dist;
      document.getElementById('hcp-south').innerText = `${evalSouth.hcp} HCP`;
      document.getElementById('dist-south').innerText = evalSouth.dist;

      await new Promise(r => setTimeout(r, 600));

      statusDesc.innerText = '🎴 [Step 3] Stream Data Engine ditransfer ke UI -> Membagikan kartu berurutan!';

      // Render Cards one by one with staggered delay
      for (let i = 0; i < 13; i++) {
        // Render North Card
        renderSingleCard('hand-north', northHand[i], i);
        // Render South Card
        renderSingleCard('hand-south', southHand[i], i);
        await new Promise(r => setTimeout(r, 120));
      }

      statusDesc.innerText = '🎉 [Selesai] 13 Kartu fisik di UI telah pas di-update 100% dari Dealer Engine!';
      dealBtn.disabled = false;
    }

    function renderSingleCard(containerId, c, idx) {
      const container = document.getElementById(containerId);
      const cardEl = document.createElement('div');
      cardEl.className = 'card-hand-item w-16 h-24 sm:w-28 sm:h-40 bg-white rounded-lg sm:rounded-xl shadow-md border border-slate-300 flex flex-col justify-between p-1 sm:p-2.5';
      cardEl.style.zIndex = 10 + idx;

      const color = suitColors[c.suit];
      const symbol = suitSymbols[c.suit];

      cardEl.innerHTML = `
        <div style="color: ${color};" class="font-extrabold text-[11px] sm:text-base leading-none">${c.rank}<br>${symbol}</div>
        <div style="color: ${color};" class="text-sm sm:text-3xl text-center font-bold">${symbol}</div>
        <div style="color: ${color};" class="font-extrabold text-[11px] sm:text-base leading-none text-right">${symbol}<br>${c.rank}</div>
      `;

      container.appendChild(cardEl);
      setTimeout(() => cardEl.classList.add('dealt'), 20);
    }

    // Auto run first animation
    animateDeal();
  </script>

</body>
</html>
