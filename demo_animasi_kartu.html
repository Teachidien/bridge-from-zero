<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi 4 Arah Mata Angin & Animasi Pemenang Trick - Bridge From Zero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    
    /* Layout Adaptif Kipas Kartu di Tangan (Mobile & Desktop Responsive) */
    .hand-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      padding-top: 24px;
      padding-bottom: 8px;
    }
    
    /* Ukuran HP: Kedempetan -44px agar 13 kartu muat utuh tanpa terpotong */
    .card-hand-item {
      margin-left: -44px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      position: relative;
    }

    /* Ukuran Laptop/PC (sm: 640px ke atas): Kedempetan -64px dengan kartu lebih besar */
    @media (min-width: 640px) {
      .card-hand-item {
        margin-left: -64px;
      }
    }
    
    .card-hand-item:first-child {
      margin-left: 0;
    }
    
    /* Hover Lift lurus ke atas */
    .card-hand-item:hover,
    .card-hand-item:active {
      transform: translateY(-24px);
      z-index: 999 !important;
    }

    /* Keyframes Animasi Keluar Kartu 4 Arah ke Tengah */
    @keyframes playFromSouth {
      from { transform: translateY(140px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes playFromNorth {
      from { transform: translateY(-140px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes playFromWest {
      from { transform: translateX(-140px) scale(0.8); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes playFromEast {
      from { transform: translateX(140px) scale(0.8); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }

    /* Keyframes Animasi Kartu Disapu DITERTUP (BALIK KARTU TERBALIK) ke Pemenang Trick */
    @keyframes sweepToNorth {
      to { transform: translateY(-300px) rotateY(180deg) scale(0.3); opacity: 0; }
    }
    @keyframes sweepToSouth {
      to { transform: translateY(300px) rotateY(180deg) scale(0.3); opacity: 0; }
    }
    @keyframes sweepToWest {
      to { transform: translateX(-300px) rotateY(180deg) scale(0.3); opacity: 0; }
    }
    @keyframes sweepToEast {
      to { transform: translateX(300px) rotateY(180deg) scale(0.3); opacity: 0; }
    }

    /* Animasi Pembagian 13 Kartu di Awal */
    @keyframes dealHand {
      0% { transform: translateY(-250px) scale(0.1); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .anim-south { animation: playFromSouth 0.35s ease-out forwards; }
    .anim-north { animation: playFromNorth 0.35s ease-out forwards; }
    .anim-west { animation: playFromWest 0.35s ease-out forwards; }
    .anim-east { animation: playFromEast 0.35s ease-out forwards; }

    .sweep-north { animation: sweepToNorth 0.55s ease-in forwards; }
    .sweep-south { animation: sweepToSouth 0.55s ease-in forwards; }
    .sweep-west { animation: sweepToWest 0.55s ease-in forwards; }
    .sweep-east { animation: sweepToEast 0.55s ease-in forwards; }

    .animate-deal-hand { animation: dealHand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    let scores = { south: 0, north: 0, west: 0, east: 0 };

    function triggerDealHand() {
      const container = document.getElementById('hand-container-box');
      container.classList.remove('animate-deal-hand');
      void container.offsetWidth; // reflow
      container.classList.add('animate-deal-hand');
    }

    function resetSlots() {
      ['south', 'north', 'west', 'east'].forEach(pos => {
        const slot = document.getElementById(`slot-${pos}`);
        slot.className = 'absolute hidden';
        const cardInner = slot.querySelector('.card-inner');
        if(cardInner) {
          cardInner.style.backgroundColor = '#ffffff';
          cardInner.innerHTML = getOriginalSlotContent(pos);
        }
      });
    }

    function getOriginalSlotContent(pos) {
      if(pos === 'south') return '<div class="text-[#E11D48] font-bold text-xs sm:text-sm leading-none">A<br>♥</div><div class="text-[#E11D48] text-2xl sm:text-3xl text-center">♥</div><div class="text-[#E11D48] font-bold text-xs sm:text-sm leading-none text-right">♥<br>A</div>';
      if(pos === 'north') return '<div class="text-[#1E293B] font-bold text-xs sm:text-sm leading-none">A<br>♠</div><div class="text-[#1E293B] text-2xl sm:text-3xl text-center">♠</div><div class="text-[#1E293B] font-bold text-xs sm:text-sm leading-none text-right">♠<br>A</div>';
      if(pos === 'west') return '<div class="text-[#059669] font-bold text-xs sm:text-sm leading-none">J<br>♣</div><div class="text-[#059669] text-2xl sm:text-3xl text-center">♣</div><div class="text-[#059669] font-bold text-xs sm:text-sm leading-none text-right">♣<br>J</div>';
      if(pos === 'east') return '<div class="text-[#D97706] font-bold text-xs sm:text-sm leading-none">K<br>♦</div><div class="text-[#D97706] text-2xl sm:text-3xl text-center">♦</div><div class="text-[#D97706] font-bold text-xs sm:text-sm leading-none text-right">♦<br>K</div>';
    }

    function runFullTrick(winner) {
      resetSlots();

      setTimeout(() => {
        const s = document.getElementById('slot-south');
        s.className = 'absolute bottom-1 sm:bottom-2 block anim-south';
      }, 100);

      setTimeout(() => {
        const w = document.getElementById('slot-west');
        w.className = 'absolute left-1 sm:left-2 block anim-west';
      }, 400);

      setTimeout(() => {
        const n = document.getElementById('slot-north');
        n.className = 'absolute top-1 sm:top-2 block anim-north';
      }, 700);

      setTimeout(() => {
        const e = document.getElementById('slot-east');
        e.className = 'absolute right-1 sm:right-2 block anim-east';
      }, 1000);

      setTimeout(() => {
        ['south', 'north', 'west', 'east'].forEach(pos => {
          const slot = document.getElementById(`slot-${pos}`);
          const cardInner = slot.querySelector('.card-inner');
          
          if(cardInner) {
            cardInner.style.backgroundColor = '#182232';
            cardInner.innerHTML = '<div class="w-full h-full border border-slate-600/60 rounded-md sm:rounded-lg flex items-center justify-center bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:6px_6px]"><span class="text-slate-500 font-bold text-[10px] sm:text-xs">♠♥♦♣</span></div>';
          }
          
          slot.className = `absolute block sweep-${winner}`;
        });

        scores[winner]++;
        document.getElementById(`score-${winner}`).innerText = `Tricks: ${scores[winner]}`;
        
        const badge = document.getElementById(`badge-${winner}`);
        if(badge) {
          badge.classList.add('scale-110');
          setTimeout(() => badge.classList.remove('scale-110'), 600);
        }
      }, 1800);
    }
  </script>
